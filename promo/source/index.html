<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Inter+Tight:ital,wght@0,600;0,800;0,900;1,800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const qs = new URLSearchParams(location.search);
const W = +(qs.get("w") || 1080), H = +(qs.get("h") || 1920);
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
const u = Math.min(W, H) / 1080;
const PORTRAIT = H > W;
const C = {
  bg: "#F7F3ED", ink: "#3e3a39", dark: "#211e1d", blue: "#a9dbee", green: "#6bbc70",
  yellow: "#f8d478", brown: "#6A5748", soft: "#e7eef3", white: "#ffffff",
};
const JP = '"Noto Sans JP","Yu Gothic",sans-serif';
const EN = '"Inter Tight","Segoe UI",sans-serif';
const MONO = '"JetBrains Mono",Consolas,monospace';
const BEAT = 0.5;
const ANG = Math.atan2(161 - 458, 612 - 20); // logo arrow angle

// ---------- easing / helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eInCubic = (x) => x * x * x;
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const eInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOutBack = (x) => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
let rs = 7;
const rand = () => ((rs = (rs * 16807) % 2147483647) / 2147483647);

function font(size, fam = JP, weight = 900, italic = "") { return `${italic} ${weight} ${size}px ${fam}`; }
function fit(str, maxW, size, fam, weight) {
  ctx.font = font(size, fam, weight);
  const w = ctx.measureText(str).width;
  return w > maxW ? size * maxW / w : size;
}
function txt(str, x, y, size, o = {}) {
  ctx.save();
  ctx.font = font(size, o.fam || JP, o.weight || 900, o.italic || "");
  ctx.fillStyle = o.color || C.ink;
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = "middle";
  if (o.track) ctx.letterSpacing = o.track * size + "px";
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 3 * u; ctx.strokeText(str, x, y); }
  else ctx.fillText(str, x, y);
  ctx.restore();
}
// masked slide-up reveal; pin/pout 0..1
function reveal(str, x, y, size, pin, pout = 0, o = {}) {
  if (pin <= 0 || pout >= 1) return;
  const off = (1 - eOutExpo(pin)) * size * 1.25 - eInCubic(pout) * size * 1.25;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, y - size * 0.72, W, size * 1.44);
  ctx.clip();
  txt(str, x, y + off, size, o);
  ctx.restore();
}
// per-character stagger reveal
function revealChars(str, x, y, size, t0, t, stagger, o = {}) {
  ctx.save();
  ctx.font = font(size, o.fam || JP, o.weight || 900);
  if (o.track) ctx.letterSpacing = o.track * size + "px";
  const chars = [...str];
  const widths = chars.map((c) => ctx.measureText(c).width + (o.track || 0) * size);
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = x - total / 2;
  ctx.restore();
  chars.forEach((c, i) => {
    const p = prog(t, t0 + i * stagger, t0 + i * stagger + 0.35);
    reveal(c, cx + widths[i] / 2, y, size, p, o.pout || 0, { ...o, track: 0 });
    cx += widths[i];
  });
}
function fillBg(c) { ctx.fillStyle = c; ctx.fillRect(-W, -H, W * 3, H * 3); }
function stadium(cx, cy, w, h) {
  const r = h / 2;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2 + r, cy - h / 2);
  ctx.lineTo(cx + w / 2 - r, cy - h / 2);
  ctx.arc(cx + w / 2 - r, cy, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(cx - w / 2 + r, cy + h / 2);
  ctx.arc(cx - w / 2 + r, cy, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
}
// diagonal wipe along the arrow angle; p 0..1 covers screen
function diagWipe(p, color) {
  if (p <= 0) return;
  const D = Math.hypot(W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(ANG + Math.PI / 2);
  ctx.fillStyle = color;
  const x = lerp(-D, D, p) ;
  ctx.fillRect(-D, -D, x + D, D * 2);
  ctx.restore();
}

// ---------- topographic contours (precomputed) ----------
const topo = (() => {
  const GX = 90, GY = Math.round(90 * H / W);
  const f = [];
  const blobs = [];
  for (let i = 0; i < 9; i++) blobs.push([rand(), rand(), 0.08 + rand() * 0.2, rand() > 0.3 ? 1 : -0.7]);
  for (let j = 0; j <= GY; j++) for (let i = 0; i <= GX; i++) {
    const x = i / GX, y = (j / GY) * (H / W);
    let v = 0;
    for (const [bx, by, r, s] of blobs) { const d2 = (x - bx) ** 2 + (y - by * H / W) ** 2; v += s * Math.exp(-d2 / (r * r)); }
    v += 0.12 * Math.sin(x * 9 + y * 5) + 0.08 * Math.sin(y * 13 - x * 4);
    f.push(v);
  }
  const at = (i, j) => f[j * (GX + 1) + i];
  const levels = [];
  for (let L = -0.6; L < 1.6; L += 0.11) {
    const p = new Path2D();
    for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
      const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
      const pts = [];
      const e = (v1, v2, x1, y1, x2, y2) => { const k = (L - v1) / (v2 - v1); pts.push([(x1 + (x2 - x1) * k) / GX, (y1 + (y2 - y1) * k) / GY]); };
      if ((a > L) !== (b > L)) e(a, b, i, j, i + 1, j);
      if ((b > L) !== (c > L)) e(b, c, i + 1, j, i + 1, j + 1);
      if ((c > L) !== (d > L)) e(c, d, i + 1, j + 1, i, j + 1);
      if ((d > L) !== (a > L)) e(d, a, i, j + 1, i, j);
      for (let k = 0; k + 1 < pts.length; k += 2) { p.moveTo(pts[k][0] * W, pts[k][1] * H); p.lineTo(pts[k + 1][0] * W, pts[k + 1][1] * H); }
    }
    levels.push(p);
  }
  return levels;
})();
function drawTopo(color, alpha, radiusP = 1, zoom = 1, rot = 0, lw = 2) {
  ctx.save();
  if (radiusP < 1) { ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.hypot(W, H) * 0.55 * eOutCubic(radiusP), 0, Math.PI * 2); ctx.clip(); }
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2);
  ctx.strokeStyle = color; ctx.lineWidth = lw * u / zoom; ctx.globalAlpha = alpha;
  topo.forEach((p, i) => { ctx.globalAlpha = alpha * (i % 5 === 0 ? 1.6 : 0.8); ctx.stroke(p); });
  ctx.restore();
}

// ---------- grain ----------
const grain = (() => {
  const g = document.createElement("canvas"); g.width = g.height = 256;
  const gx = g.getContext("2d"); const id = gx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = rand() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
})();
function drawGrain(t) {
  ctx.save();
  ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = "overlay";
  const ox = Math.floor((t * 977) % 256), oy = Math.floor((t * 613) % 256);
  ctx.translate(-ox, -oy);
  ctx.fillStyle = ctx.createPattern(grain, "repeat");
  ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
function vignette(a = 0.5) {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- logo ----------
function logo(cx, cy, s, t0, t) {
  // s: scale relative to the 640px source art
  const lt = t - t0;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-320, -320);
  const bodyP = prog(lt, 0, 0.45);
  if (bodyP > 0) {
    ctx.save();
    const sc = eOutBack(bodyP);
    ctx.translate(320, 318); ctx.scale(sc, sc); ctx.translate(-320, -318);
    stadium(320, 318.5, 514, 347); ctx.clip();
    const R = 520;
    const regions = [
      [C.blue, null],
      [C.green, "Ah"],
      ["#e4ebf1", "Ha"],
      [C.yellow, "AH"],
    ];
    regions.forEach(([col, k], i) => {
      const rp = eOutExpo(prog(lt, 0.05 + i * 0.07, 0.6 + i * 0.07));
      if (rp <= 0) return;
      ctx.save();
      if (k && k.includes("A")) { ctx.beginPath(); ctx.moveTo(-200, 458 + 220 * 0.5017); ctx.lineTo(900, 458 - 880 * 0.5017); ctx.lineTo(900, 900); ctx.lineTo(-200, 900); ctx.clip(); }
      if (k && k.includes("a")) { ctx.beginPath(); ctx.moveTo(-200, 458 + 220 * 0.5017); ctx.lineTo(900, 458 - 880 * 0.5017); ctx.lineTo(900, -300); ctx.lineTo(-200, -300); ctx.clip(); }
      if (k && k.includes("h")) { ctx.beginPath(); ctx.moveTo(-200, 308 - 230 * 0.1898); ctx.lineTo(900, 308 + 870 * 0.1898); ctx.lineTo(900, -300); ctx.lineTo(-200, -300); ctx.clip(); }
      if (k && k.includes("H")) { ctx.beginPath(); ctx.moveTo(-200, 308 - 230 * 0.1898); ctx.lineTo(900, 308 + 870 * 0.1898); ctx.lineTo(900, 900); ctx.lineTo(-200, 900); ctx.clip(); }
      ctx.beginPath(); ctx.arc(235, 345, R * rp, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }
  // horizon bar wipes from left
  const hp = eOutExpo(prog(lt, 0.25, 0.7));
  if (hp > 0) {
    ctx.save();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 17; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(30, 308); ctx.lineTo(lerp(30, 620, hp), lerp(308, 420, hp)); ctx.stroke();
    ctx.restore();
  }
  // arrow shoots in from bottom-left
  const ap = prog(lt, 0.4, 0.85);
  if (ap > 0) {
    const e = eOutExpo(ap);
    const dx = Math.cos(ANG), dy = Math.sin(ANG);
    const back = (1 - e) * 1400;
    ctx.save();
    ctx.translate(-dx * back, -dy * back);
    // speed streaks
    if (ap < 1) {
      ctx.strokeStyle = C.ink; ctx.lineCap = "round";
      [[-30, 5, 0.6], [26, 3, 0.4], [55, 2, 0.3], [-60, 2, 0.3]].forEach(([o, w, a]) => {
        ctx.globalAlpha = a * (1 - ap); ctx.lineWidth = w;
        const nx = -dy * o, ny = dx * o;
        ctx.beginPath(); ctx.moveTo(300 + nx, 330 + ny); ctx.lineTo(300 + nx - dx * 900 * (1 - ap), 330 + ny - dy * 900 * (1 - ap)); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.moveTo(18, 428); ctx.lineTo(503, 207); ctx.lineTo(522, 223); ctx.lineTo(24, 490);
    ctx.quadraticCurveTo(16, 492, 16, 482); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(452, 207); ctx.lineTo(612, 160); ctx.lineTo(541, 238); ctx.lineTo(508, 218); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9eef3";
    ctx.beginPath(); ctx.moveTo(512, 214); ctx.lineTo(598, 170); ctx.lineTo(541, 226); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---------- map pin ----------
function pin(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, -60, 44, Math.PI * 0.8, Math.PI * 2.2); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.dark; ctx.beginPath(); ctx.arc(0, -60, 17, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ================= SCENES =================
const cx = W / 2;
const BIG = (PORTRAIT ? 150 : 140) * u;

function scene1(t) {
  // b0-8 (0-4s): the everyday is geography
  fillBg(C.dark);
  const z = 1.15 - t * 0.03;
  drawTopo(C.soft, 0.16, prog(t, 0, 1.4), z, t * 0.01, 1.6);
  // city grid from 1s
  const gp = prog(t, 1, 1.5) * (1 - prog(t, 2.9, 3.3));
  if (gp > 0) {
    ctx.save(); ctx.strokeStyle = C.blue; ctx.globalAlpha = 0.35 * gp; ctx.lineWidth = 1.5 * u;
    ctx.translate(cx, H / 2); ctx.rotate(-0.35);
    const step = 70 * u, n = 18;
    for (let i = -n; i <= n; i++) {
      const L = eOutExpo(gp) * n * step;
      ctx.beginPath(); ctx.moveTo(i * step, -L); ctx.lineTo(i * step, L); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-L, i * step); ctx.lineTo(L, i * step); ctx.stroke();
    }
    ctx.restore();
  }
  vignette(0.6);
  const y = H / 2;
  const phrases = [
    ["地形を眺める。", "READ THE LANDSCAPE", 0.0, 1.0],
    ["街を想像する。", "IMAGINE HOW CITIES GREW", 1.0, 2.0],
    ["地図アプリを開く。", "OPEN A MAP APP", 2.0, 3.0],
    ["それ、ぜんぶ", "ALL OF IT IS", 3.0, 3.5],
  ];
  phrases.forEach(([jp, en, a, b]) => {
    const pi = prog(t, a + 0.02, a + 0.4), po = prog(t, b - 0.12, b);
    const sz = fit(jp, W * 0.86, 120 * u, JP, 900);
    reveal(jp, cx, y, sz, pi, po, { color: C.bg });
    reveal(en, cx, y + 120 * u, 30 * u, prog(t, a + 0.1, a + 0.5), po, { fam: MONO, weight: 700, color: C.yellow, track: 0.25 });
  });
  // map pin drops at 2.0s
  const pp = prog(t, 2.05, 2.45), po = prog(t, 2.85, 3.0);
  if (pp > 0 && po < 1) {
    const dropY = lerp(-300 * u, 0, eOutBack(pp));
    pin(cx, y - 140 * u + dropY - po * 400 * u, 1.3 * u * (1 - po), C.green);
    const rp = prog(t, 2.35, 2.95);
    ctx.save(); ctx.strokeStyle = C.green; ctx.lineWidth = 3 * u; ctx.globalAlpha = 1 - rp;
    ctx.beginPath(); ctx.ellipse(cx, y - 140 * u, 160 * u * eOutCubic(rp), 40 * u * eOutCubic(rp), 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  // 3.5s SLAM: 地理。
  if (t >= 3.5) {
    const p = prog(t, 3.5, 3.75);
    const sc = lerp(1.6, 1, eOutExpo(p));
    ctx.save(); ctx.translate(cx, y); ctx.scale(sc, sc);
    txt("地理。", 0, -20 * u, 300 * u, { color: C.green, alpha: clamp(p * 3) });
    ctx.restore();
    reveal("GEOGRAPHY.", cx, y + 170 * u, 64 * u, prog(t, 3.6, 3.9), 0, { fam: EN, weight: 900, color: C.bg, track: 0.08 });
    // flash
    ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - prog(t, 3.5, 3.7))})`; ctx.fillRect(0, 0, W, H);
  }
}

const hubNodes = [
  ["防災", "RESILIENCE", C.blue], ["都市", "CITIES", C.yellow], ["環境", "ENVIRONMENT", C.green],
  ["交通", "MOBILITY", C.blue], ["観光", "TOURISM", C.yellow], ["データ", "DATA", C.green],
];
function scene2(t) {
  // 4-6s: geography is a hub
  const lt = t - 4;
  fillBg(C.bg);
  drawTopo(C.ink, 0.07, 1, 1.05, 0.05, 1.4);
  const hy = H * (PORTRAIT ? 0.6 : 0.5), R = (PORTRAIT ? 330 : 300) * u;
  const hx = PORTRAIT ? cx : W * 0.7;
  const rot = lt * 0.25 - 0.3;
  hubNodes.forEach(([jp, en, col], i) => {
    const a = rot + (i / 6) * Math.PI * 2 - Math.PI / 2;
    const p = eOutExpo(prog(lt, 0.15 + i * 0.12, 0.6 + i * 0.12));
    if (p <= 0) return;
    const x = hx + Math.cos(a) * R * p, y = hy + Math.sin(a) * R * p;
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3 * u; ctx.setLineDash([10 * u, 8 * u]); ctx.lineDashOffset = -lt * 60 * u;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
    const r = 78 * u * eOutBack(prog(lt, 0.2 + i * 0.12, 0.55 + i * 0.12));
    if (r > 0) {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      txt(jp, x, y - 8 * u, (jp.length > 2 ? 30 : 38) * u * (r / (78 * u)), { color: C.ink });
      txt(en, x, y + 28 * u, 13 * u * (r / (78 * u)), { fam: MONO, weight: 700, color: C.ink, track: 0.1 });
    }
  });
  // center hub with pulse
  const cp = eOutBack(prog(lt, 0, 0.35));
  const pulse = (lt * 2) % 1;
  ctx.save(); ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.5 * (1 - pulse); ctx.lineWidth = 3 * u;
  ctx.beginPath(); ctx.arc(hx, hy, 110 * u + pulse * 120 * u, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(hx, hy, 110 * u * cp, 0, Math.PI * 2); ctx.fill();
  if (cp > 0.5) txt("地理", hx, hy, 64 * u, { color: C.bg });
  const ty = PORTRAIT ? H * 0.2 : H * 0.36;
  const tx = PORTRAIT ? cx : W * 0.28;
  reveal("地理は、", tx, ty, 80 * u, prog(lt, 0.05, 0.45), prog(lt, 1.88, 2), { color: C.ink });
  reveal("分野をつなぐハブ。", tx, ty + 105 * u, fit("分野をつなぐハブ。", PORTRAIT ? W * 0.88 : W * 0.46, 100 * u, JP, 900), prog(lt, 0.2, 0.6), prog(lt, 1.88, 2), { color: C.ink });
  reveal("GEOGRAPHY IS A HUB BETWEEN FIELDS", tx, ty + 200 * u, 28 * u, prog(lt, 0.35, 0.75), prog(lt, 1.88, 2), { fam: MONO, weight: 700, color: C.brown, track: 0.12 });
}

const pillars = [
  { jp: "知る", en: "DISCOVER", sjp: "「きっかけ」を届ける", sen: "Creating a first encounter", bg: C.blue, fg: C.ink },
  { jp: "考える", en: "THINK", sjp: "「視点」を広げる", sen: "Broadening perspectives", bg: C.green, fg: C.ink },
  { jp: "形にする", en: "CREATE", sjp: "「体験」を生み出す", sen: "Turning ideas into experience", bg: C.yellow, fg: C.ink },
  { jp: "繋がる", en: "CONNECT", sjp: "「環境」を育む", sen: "Building an environment", bg: C.brown, fg: C.bg },
];
function motif(i, lt, P) {
  const my = H * (PORTRAIT ? 0.74 : 0.5);
  const mx = PORTRAIT ? cx : W * 0.8;
  ctx.save(); ctx.strokeStyle = P.fg; ctx.fillStyle = P.fg; ctx.globalAlpha = 0.9;
  if (i === 0) { // ripples: discovery
    for (let k = 0; k < 5; k++) {
      const r = ((lt * 0.9 + k * 0.2) % 1);
      ctx.globalAlpha = 0.6 * (1 - r); ctx.lineWidth = 4 * u;
      ctx.beginPath(); ctx.arc(mx, my, 40 * u + r * 300 * u, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(mx, my, 26 * u * eOutBack(prog(lt, 0, 0.3)), 0, Math.PI * 2); ctx.fill();
  } else if (i === 1) { // compass / rotating rings: perspective
    ctx.lineWidth = 4 * u;
    [[260, 1, [30, 18]], [190, -1.6, [6, 14]], [120, 2.2, [60, 30]]].forEach(([r, sp, dash]) => {
      ctx.setLineDash(dash.map((d) => d * u)); ctx.beginPath();
      ctx.arc(mx, my, r * u * eOutExpo(prog(lt, 0, 0.5)), lt * sp, lt * sp + Math.PI * 2); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.save(); ctx.translate(mx, my); ctx.rotate(Math.sin(lt * 3) * 0.6 + 0.4);
    ctx.beginPath(); ctx.moveTo(0, -110 * u); ctx.lineTo(18 * u, 0); ctx.lineTo(0, 110 * u); ctx.lineTo(-18 * u, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  } else if (i === 2) { // rising 3D-ish blocks: making data visible
    const n = PORTRAIT ? 9 : 6, bw = 64 * u, gap = 18 * u, base = my + 200 * u, x0 = mx - (n * bw + (n - 1) * gap) / 2;
    for (let k = 0; k < n; k++) {
      const h = (90 + 260 * Math.abs(Math.sin(k * 1.7 + 0.5))) * u * eOutBack(prog(lt, 0.1 + k * 0.05, 0.6 + k * 0.05));
      const x = x0 + k * (bw + gap);
      ctx.globalAlpha = 0.95; ctx.fillRect(x, base - h, bw, h);
      ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x + 16 * u, base - h - 14 * u); ctx.lineTo(x + bw + 16 * u, base - h - 14 * u); ctx.lineTo(x + bw, base - h); ctx.fill();
    }
  } else { // network: connecting
    const pts = [];
    for (let k = 0; k < 11; k++) {
      const a = k * 2.399 + lt * 0.3, r = (60 + (k * 37) % 250) * u;
      pts.push([mx + Math.cos(a) * r * 1.3, my + Math.sin(a) * r * 0.9]);
    }
    const lp = prog(lt, 0.1, 1.2);
    ctx.lineWidth = 3 * u; ctx.globalAlpha = 0.7;
    pts.forEach((p, k) => pts.forEach((q, m) => {
      if (m <= k || Math.hypot(p[0] - q[0], p[1] - q[1]) > 260 * u) return;
      const e = clamp(lp * 3 - (k / 11) * 2);
      if (e <= 0) return;
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(lerp(p[0], q[0], e), lerp(p[1], q[1], e)); ctx.stroke();
    }));
    ctx.globalAlpha = 1;
    pts.forEach((p, k) => { const r = (k % 3 === 0 ? 16 : 10) * u * eOutBack(prog(lt, k * 0.05, k * 0.05 + 0.3)); ctx.fillStyle = [C.blue, C.green, C.yellow][k % 3]; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill(); });
  }
  ctx.restore();
}
function scene3(t) {
  // 6-14s: four pillars, 2s each
  const i = clamp(Math.floor((t - 6) / 2), 0, 3);
  const lt = t - 6 - i * 2;
  const P = pillars[i];
  const prev = i === 0 ? C.bg : pillars[i - 1].bg;
  fillBg(prev);
  diagWipe(eInOut(prog(lt, 0, 0.32)), P.bg);
  ctx.save();
  // subtle push
  const push = lt * 12 * u;
  ctx.translate(0, -push);
  drawTopo(P.fg, 0.08 * prog(lt, 0.2, 0.6), 1, 1.2 + i * 0.1, i * 0.7, 1.4);
  const left = PORTRAIT ? 80 * u : 120 * u;
  const ty = PORTRAIT ? H * 0.29 : H * 0.42;
  const pout = prog(lt, 1.85, 2);
  // index
  reveal(`0${i + 1} — 04`, left, ty - 230 * u, 30 * u, prog(lt, 0.2, 0.5), pout, { fam: MONO, weight: 700, color: P.fg, align: "left", track: 0.2 });
  // giant JP
  const maxW = PORTRAIT ? W - left * 2 : W * 0.55;
  const sz = fit(P.jp, maxW, 280 * u, JP, 900);
  reveal(P.jp, left, ty, sz, prog(lt, 0.18, 0.55), pout, { color: P.fg, align: "left" });
  // EN outline + fill sweep
  reveal(P.en, left, ty + sz * 0.62 + 20 * u, 96 * u, prog(lt, 0.4, 0.75), pout, { fam: EN, weight: 900, color: P.fg, align: "left", track: 0.02, italic: "italic" });
  // bar
  const bp = eOutExpo(prog(lt, 0.55, 1.0)) * (1 - pout);
  ctx.fillStyle = P.fg; ctx.fillRect(left, ty + sz * 0.62 + 100 * u, 140 * u * bp, 8 * u);
  reveal(P.sjp, left, ty + sz * 0.62 + 165 * u, 52 * u, prog(lt, 0.65, 1.0), pout, { color: P.fg, align: "left", weight: 700 });
  reveal(P.sen, left, ty + sz * 0.62 + 232 * u, 32 * u, prog(lt, 0.75, 1.1), pout, { fam: EN, weight: 600, color: P.fg, align: "left", alpha: 0.85 });
  if (pout < 1) { ctx.globalAlpha = 1 - pout; motif(i, lt, P); ctx.globalAlpha = 1; }
  ctx.restore();
}

const acts = [
  ["勉強会", "STUDY SESSIONS", C.blue],
  ["LT会", "LIGHTNING TALKS", C.yellow],
  ["フィールドワーク", "FIELDWORK", C.green],
  ["コンテスト", "COMPETITIONS", C.blue],
  ["交流会", "MEETUPS", C.yellow],
  ["就職相談", "CAREER TALKS", C.green],
];
function scene4(t) {
  // 14-18s: activities rapid-fire, one per beat; then inclusivity line
  const lt = t - 14;
  fillBg(C.dark);
  // fast scrolling contour background
  drawTopo(C.soft, 0.08, 1, 1.4 + lt * 0.08, lt * 0.15, 1.4);
  const k = Math.floor(lt / BEAT);
  const ty = PORTRAIT ? H * 0.16 : H * 0.14;
  if (lt < 3) {
    txt("WHAT WE DO", cx, ty, 30 * u, { fam: MONO, weight: 700, color: C.soft, track: 0.3, alpha: prog(lt, 0, 0.2) });
    // progress ticks
    for (let j = 0; j < 6; j++) {
      ctx.fillStyle = j <= k ? acts[j][2] : "rgba(255,255,255,0.15)";
      ctx.fillRect(cx - 150 * u + j * 52 * u, ty + 40 * u, 44 * u, 6 * u);
    }
  }
  if (lt < 3) {
    const [jp, en, col] = acts[k];
    const bt = lt - k * BEAT;
    const sp = eOutExpo(prog(bt, 0, 0.18));
    // stadium plate
    const pw = (PORTRAIT ? 920 : 1100) * u, ph = 380 * u;
    ctx.save(); ctx.translate(cx, H / 2); ctx.rotate(-0.06 + (k % 2) * 0.12 * 0); ctx.scale(lerp(0.6, 1, sp), lerp(0.6, 1, sp));
    stadium(0, 0, pw, ph); ctx.fillStyle = col; ctx.fill();
    ctx.restore();
    const sc = lerp(1.25, 1, eOutExpo(prog(bt, 0, 0.2)));
    ctx.save(); ctx.translate(cx, H / 2); ctx.scale(sc, sc);
    const sz = fit(jp, pw * 0.8, 170 * u, JP, 900);
    txt(jp, 0, -30 * u, sz, { color: C.ink });
    txt(en, 0, 100 * u, 34 * u, { fam: MONO, weight: 700, color: C.ink, track: 0.2 });
    ctx.restore();
  } else {
    const p = lt - 3;
    const y = H / 2 - 120 * u;
    const words = ["学部も、", "専門も、", "スキルも、"];
    words.forEach((w, j) => reveal(w, cx, y + j * 120 * u, 100 * u, prog(p, j * 0.12, j * 0.12 + 0.3), 0, { color: [C.blue, C.green, C.yellow][j] }));
    reveal("問わない。", cx, y + 3 * 120 * u + 20 * u, 130 * u, prog(p, 0.45, 0.75), 0, { color: C.bg });
    reveal("ANY MAJOR. ANY FIELD. ANY SKILL LEVEL.", cx, y + 3 * 120 * u + 130 * u, fit("ANY MAJOR. ANY FIELD. ANY SKILL LEVEL.", W * 0.88, 30 * u, MONO, 700), prog(p, 0.55, 0.85), 0, { fam: MONO, weight: 700, color: C.soft, track: 0.12 });
  }
  vignette(0.5);
}

function scene5(t) {
  // 18-20s: build-up — the feelings that bring people in
  const lt = t - 18;
  fillBg(C.bg);
  diagWipe(1 - eInOut(prog(lt, 0, 0.3)), C.dark); // dark recedes
  const z = 1 + lt * 0.06;
  const sh = lt > 1.4 ? (rand() - 0.5) * 6 * u * (lt - 1.4) : 0;
  ctx.save(); ctx.translate(cx + sh, H / 2 + sh); ctx.scale(z, z); ctx.translate(-cx, -H / 2);
  drawTopo(C.ink, 0.06, 1, 1, 0.2, 1.4);
  const lines = [
    ["「地理が好き」", "I LOVE GEOGRAPHY", C.green],
    ["「GISに興味がある」", "I'M CURIOUS ABOUT GIS", C.blue],
    ["「仲間と形にしたい」", "I WANT TO BUILD WITH OTHERS", C.yellow],
  ];
  const y0 = H / 2 - (PORTRAIT ? 260 : 320) * u, SP = (PORTRAIT ? 210 : 165) * u;
  lines.forEach(([jp, en, col], j) => {
    const a = j * 0.5;
    const y = y0 + j * SP;
    const sz = fit(jp, W * 0.88, 92 * u, JP, 900);
    // highlight swipe
    const hp = eOutExpo(prog(lt, a + 0.05, a + 0.35));
    ctx.save(); ctx.font = font(sz, JP, 900); const w = ctx.measureText(jp).width; ctx.restore();
    ctx.fillStyle = col; ctx.fillRect(cx - w / 2 - 10 * u, y + sz * 0.1, (w + 20 * u) * hp, sz * 0.42);
    reveal(jp, cx, y, sz, prog(lt, a, a + 0.3), 0, { color: C.ink });
    reveal(en, cx, y + 80 * u, 26 * u, prog(lt, a + 0.1, a + 0.4), 0, { fam: MONO, weight: 700, color: C.brown, track: 0.15 });
  });
  reveal("その気持ちがあれば、", cx, y0 + 3 * SP + 10 * u, 64 * u, prog(lt, 1.5, 1.75), 0, { color: C.ink });
  ctx.restore();
  // white-out into the logo
  ctx.fillStyle = `rgba(255,255,255,${eInCubic(prog(lt, 1.75, 2))})`; ctx.fillRect(0, 0, W, H);
}

function scene6(t) {
  // 20-26.5s: logo + tagline + CTA
  const lt = t - 20;
  fillBg(C.bg);
  drawTopo(C.ink, 0.06 * prog(lt, 0.5, 1.5), prog(lt, 0.3, 2), 1.1 - lt * 0.01, -0.2, 1.3);
  const ly = PORTRAIT ? H * 0.3 : H * 0.3;
  const ls = (PORTRAIT ? 1.35 : 0.85) * u * lerp(1.06, 1, eOutCubic(prog(lt, 0, 3)));
  logo(cx, ly, ls, 0.0, lt);
  const tyy = ly + 270 * ls + (PORTRAIT ? 90 : 30) * u;
  revealChars("YOUTH GEO JAPAN", cx, tyy, fit("YOUTH GEO JAPAN", W * 0.8, 96 * u, EN, 800) * 0.95, 0.9, lt, 0.03, { fam: EN, weight: 800, color: C.ink, track: 0.04 });
  reveal("好奇心を、まっすぐ未来へ。", cx, tyy + 120 * u, fit("好奇心を、まっすぐ未来へ。", W * 0.86, 64 * u, JP, 700), prog(lt, 1.6, 2.0), 0, { color: C.ink, weight: 700 });
  reveal("Curiosity, straight into the future.", cx, tyy + 190 * u, 34 * u, prog(lt, 1.9, 2.3), 0, { fam: EN, weight: 600, color: C.brown, italic: "italic" });
  // CTA
  const cp = eOutBack(prog(lt, 3.0, 3.4));
  if (cp > 0) {
    const by = PORTRAIT ? H * 0.78 : tyy + 300 * u;
    ctx.save(); ctx.translate(cx, by); ctx.scale(cp, cp);
    stadium(0, 0, 460 * u, 110 * u); ctx.fillStyle = C.green; ctx.fill();
    txt("JOIN US  →", 0, 2 * u, 46 * u, { fam: EN, weight: 900, color: C.white, track: 0.08 });
    ctx.restore();
    reveal("youthgeojp.com", cx, by + 105 * u, 36 * u, prog(lt, 3.3, 3.7), 0, { fam: MONO, weight: 700, color: C.ink, track: 0.06 });
  }
  // white flash in
  ctx.fillStyle = `rgba(255,255,255,${1 - eOutCubic(prog(lt, 0, 0.5))})`; ctx.fillRect(0, 0, W, H);
  // fade out at very end
  ctx.fillStyle = `rgba(247,243,237,${prog(lt, 6.0, 6.5)})`; ctx.fillRect(0, 0, W, H);
}

function shake(t) {
  const hits = [[3.5, 14], [4.0, 8], [20.0, 18]];
  let a = 0;
  for (const [h, s] of hits) if (t >= h && t < h + 0.4) a += s * (1 - (t - h) / 0.4);
  return a * u;
}

window.render = function (t) {
  rs = 1000 + Math.floor(t * 30); // deterministic per-frame randomness
  ctx.save();
  const s = shake(t);
  ctx.translate((Math.sin(t * 97) * s), (Math.cos(t * 71) * s));
  if (t < 4) scene1(t);
  else if (t < 6) scene2(t);
  else if (t < 14) scene3(t);
  else if (t < 18) scene4(t);
  else if (t < 20) scene5(t);
  else scene6(t);
  // crossfade-free hard cut wipe from scene1 -> scene2
  if (t >= 4 && t < 4.3) { ctx.save(); diagWipe(1 - eInOut(prog(t, 4, 4.3)), C.dark); ctx.restore(); }
  ctx.restore();
  drawGrain(t);
};
const ALL = [...new Set(document.scripts[0].textContent)].join("");
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([
    document.fonts.load(font(100, JP, 900), ALL), document.fonts.load(font(100, JP, 700), ALL),
    document.fonts.load(font(100, EN, 900), "A"), document.fonts.load(font(100, EN, 800), "A"),
    document.fonts.load(font(100, EN, 600), "A"), document.fonts.load(font(100, EN, 800, "italic"), "A"),
    document.fonts.load(font(100, EN, 900, "italic"), "A"), document.fonts.load(font(100, MONO, 700), "A"),
  ]);
  render(0);
  return [...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family + f.weight).join(",");
})();
if (qs.get("t")) window.ready.then(() => render(+qs.get("t")));
</script>
